services:
  rag_app:
    build: ./app
    container_name: turbovec_rag_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_API_BASE=http://host.docker.internal:12434/v1
      - LLM_MODEL=docker.io/ai/qwen2.5:3B-Q4_K_M
      - HF_ENDPOINT=https://hf-mirror.com
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    ports:
      - "18088:18088"
    volumes:
      - ./app:/app
